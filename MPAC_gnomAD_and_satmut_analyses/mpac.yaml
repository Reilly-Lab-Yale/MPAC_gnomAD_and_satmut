name: mpac
channels:
  - conda-forge
  - bioconda
dependencies:
  # Core tools
  - r-base=4.4.1
  - htslib=1.21
  - bcftools=1.21
  - bedtools=2.31.1

  # R packages (CRAN) — preprocessing
  - r-tidyverse=2.0.0
  - r-data.table=1.17.8
  - r-stringi=1.8.7

  # R packages (CRAN) — analysis and visualization
  - r-biocmanager
  - r-cairo=1.6.2
  - r-corrplot=0.95
  - r-cowplot=1.2.0
  - r-ggally=2.4.0
  - r-ggpubr=0.6.3
  - r-ggrepel=0.9.6
  - r-ggthemes=5.2.0
  - r-magrittr=2.0.4
  - r-patchwork=1.3.2
  - r-scales=1.4.0
  - r-tidyplots=0.4.0
  - r-viridis=0.6.5

  # R packages (Bioconductor) — preprocessing
  - bioconductor-genomicranges=1.58.0
  - bioconductor-plyranges=1.26.0
  - bioconductor-rtracklayer=1.66.0

  # R packages (Bioconductor) — analysis and visualization
  - bioconductor-bsgenome.hsapiens.ucsc.hg38=1.4.5
  - bioconductor-complexheatmap=2.22.0

  # R packages (installed via R after conda env creation)
  # install.packages(c("enrichR", "remotes"))
  # remotes::install_github("snystrom/memes")
  # BiocManager::install("universalmotif")
